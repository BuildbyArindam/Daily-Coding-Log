name: Update README stats

on:
  push:
    branches: [main]
    paths: ["DSA-Practice/**"]   # any file added/removed at ANY depth (e.g. LeetCode/Easy/...)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_readme.py
      - name: Commit README if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: auto-update README stats"
          git pull --rebase origin main
          git push
